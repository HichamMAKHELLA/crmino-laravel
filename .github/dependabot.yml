version: 2
# trigger scan composer
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Dépendances PHP (Composer). PAS de groupe : les mises à jour composer
  # groupées font planter Dependabot en interne (GroupUpdateAllVersions),
  # constaté le 07/09/2026. Une PR par dépendance contourne le bug.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5

  # Dépendances front (npm).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    groups:
      js:
        patterns:
          - "*"
